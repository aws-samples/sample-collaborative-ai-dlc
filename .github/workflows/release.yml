name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict SemVer without a v prefix (for example, 2.0.0 or 2.0.0-preview0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy_demo: ${{ steps.demo.outputs.deploy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*.x)
              # A line branch such as release/2.4.x only publishes its own line.
              line="${GITHUB_REF#refs/heads/release/}"
              line="${line%.x}"
              if [[ ! "$line" =~ ^[0-9]+\.[0-9]+$ || "$VERSION" != "$line".* ]]; then
                echo "release/$line.x may only publish $line.* versions." >&2
                exit 1
              fi
              ;;
            *)
              echo "Releases are dispatched from a release/X.Y.x branch; run Prepare Release Branch first for a new minor or major line." >&2
              exit 1
              ;;
          esac

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: npm run release:check -- "$VERSION" --final --tag-must-not-exist

      - name: Create annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$GITHUB_SHA" -m "Collaborative AI-DLC v$VERSION"
          git push origin "v$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          args=("v$VERSION" --verify-tag --generate-notes --title "Collaborative AI-DLC v$VERSION")
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Decide the demo deployment
        id: demo
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A patch for an older line must not roll the demo back from a newer one.
          newest="$(git tag --list 'v*' | sed -E 's/^v//; s/[-+].*//' | sort -V | tail -n 1)"
          if [[ "${newest%.*}" == "$(echo "$VERSION" | cut -d. -f1,2)" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Not deploying v$VERSION to the demo: v$newest is a newer release line."
          fi

  deploy-demo:
    name: Deploy release to demo
    needs: release
    if: needs.release.outputs.deploy_demo == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-demo.yml
    # Environment secrets still need named forwarding through workflow_call.
    secrets:
      ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
      APP_DOMAIN_ALIASES: ${{ secrets.APP_DOMAIN_ALIASES }}
      AUTH_CERTIFICATE_ARN: ${{ secrets.AUTH_CERTIFICATE_ARN }}
      AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
      AUTH_ROUTE53_ZONE_ID: ${{ secrets.AUTH_ROUTE53_ZONE_ID }}
      SSO_CONFIG: ${{ secrets.SSO_CONFIG }}
    with:
      ref: v${{ inputs.version }}
      require_custom_domain: true
