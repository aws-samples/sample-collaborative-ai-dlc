name: Issue Labels

# Adds the area/* label matching the "Area" dropdown of the bug and feature
# issue forms when an issue is opened. Later changes stay manual. The issue
# body is untrusted: it is only compared against the fixed map below.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  area:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Keys must match the "Area" dropdown options in
            // .github/ISSUE_TEMPLATE/bug_report.yml and feature_request.yml.
            const AREAS = {
              'Frontend (web application)': 'area/frontend',
              'Backend (APIs, orchestration)': 'area/backend',
              'Agents (AgentCore runtime)': 'area/agents',
              'Infrastructure (Terraform, installer, deployment)': 'area/infra',
              'CI and tooling': 'area/ci',
              Documentation: 'area/docs',
            };

            // Issue forms render each field as "### <label>" followed by the answer.
            const match = /^### Area\s*\n+([^\n]+)/m.exec(context.payload.issue.body ?? '');
            const label = match && AREAS[match[1].trim()];
            if (!label) {
              core.info('No area selected, nothing to label.');
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.issue.number,
              labels: [label],
            });
            core.info(`Labeled ${label}.`);
