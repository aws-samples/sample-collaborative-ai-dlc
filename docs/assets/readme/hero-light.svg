<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" aria-labelledby="t d">
  <title id="t">Collaborative AI-DLC</title>
  <desc id="d">The Collaborative AI-DLC wordmark beside a stack of overlapping presence avatars, representing several people working on the same intent at the same time.</desc>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="46" y="62" fill="#D97706" font-size="22" font-weight="750" letter-spacing="6.5">COLLABORATIVE</text>
    <text x="42" y="164" fill="#0F172A" font-size="104" font-weight="800" letter-spacing="-3">AI-DLC</text>
    <circle cx="436" cy="124" r="26" fill="#60A5FA" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="478" cy="124" r="26" fill="#818CF8" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="520" cy="124" r="26" fill="#A78BFA" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="562" cy="124" r="26" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="604" cy="124" r="26" fill="#F59E0B" stroke="#FFFFFF" stroke-width="6">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>